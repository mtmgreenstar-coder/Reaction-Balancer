name: Build Reaction Balancer Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Windows app icon from the supplied logo
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          New-Item -ItemType Directory -Force build | Out-Null
          $encoded = (Get-Content app/src/main/assets/app-logo.jpg.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes("$PWD/build/logo.jpg", [Convert]::FromBase64String($encoded))
          @'
          from PIL import Image
          Image.open("build/logo.jpg").convert("RGBA").save(
              "build/icon.ico",
              format="ICO",
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]
          )
          '@ | Set-Content -Encoding UTF8 build/make_icon.py
          python build/make_icon.py

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer EXE
        run: npm run dist:win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Reaction-Balancer-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
