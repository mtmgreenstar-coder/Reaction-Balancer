plugins { id 'com.android.application' }

def generatedLogoRes = layout.buildDirectory.dir("generated/res/appLogo")

android {
    namespace 'com.greenstar.reactionbalancer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.greenstar.reactionbalancer'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.res.srcDir(generatedLogoRes)
    }
}

tasks.register("generateAppLogo") {
    def inputFile = layout.projectDirectory.file("src/main/assets/app-logo.jpg.b64")
    def outputFile = generatedLogoRes.map { it.file("drawable-nodpi/ic_launcher_logo.jpg") }
    inputs.file(inputFile)
    outputs.file(outputFile)
    doLast {
        def encoded = inputFile.asFile.getText("UTF-8").trim()
        def bytes = java.util.Base64.getDecoder().decode(encoded)
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.bytes = bytes
    }
}

tasks.named("preBuild").configure {
    dependsOn("generateAppLogo")
}
